# zainod (lightwalletd-compatible gRPC) next to zebrad in the same container, so the
# validator address is localhost. gRPC is plaintext and must never get a public domain.
backend = "fetch"
network = "Testnet"
zebra_db_path = "/data/unused-zebra-db"

[grpc_settings]
listen_address = "0.0.0.0:8137"

[validator_settings]
validator_jsonrpc_listen_address = "127.0.0.1:18232"
validator_grpc_listen_address = "127.0.0.1:18230"

[storage.database]
path = "/data/zaino"
size = 8
sync_write_batch_size = 1
accumulator_rebuild_memory_size = 1
