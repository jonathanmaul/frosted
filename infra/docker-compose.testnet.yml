# Public testnet node (zebrad + Zaino) for local checks. Separate from the regtest stack: other
# project name, volumes and host ports, so both can run side by side.
#   docker compose -f infra/docker-compose.testnet.yml up -d zebra     # start syncing
#   docker compose -f infra/docker-compose.testnet.yml up -d           # add Zaino once zebra is synced
name: frosted-testnet

services:
  zebra:
    image: zfnd/zebra:6.4.2
    command: ["zebrad", "-c", "/etc/zebrad/zebrad.toml", "start"]
    volumes:
      - ./zebra/testnet.toml:/etc/zebrad/zebrad.toml:ro
      - zebra-testnet:/home/zebra/.cache/zebra
    ports:
      - "127.0.0.1:28232:18232" # zebrad JSON-RPC
      - "127.0.0.1:29067:8137"  # Zaino gRPC

  zaino:
    image: frosted/zaino:0.10.1-regtest
    depends_on: [zebra]
    network_mode: "service:zebra"
    command: ["start", "--config", "/app/config/zainod.toml"]
    volumes:
      - ./zaino/zainod.testnet.toml:/app/config/zainod.toml:ro
      - zaino-testnet:/app/data

volumes:
  zebra-testnet:
  zaino-testnet:
