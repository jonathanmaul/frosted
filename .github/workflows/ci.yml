name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup reads rust-toolchain.toml (channel, rustfmt, clippy, wasm32 target).
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet-helper
      - run: cargo fmt --manifest-path wallet-helper/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path wallet-helper/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path wallet-helper/Cargo.toml

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: browser-actions/setup-chrome@v2
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: cargo build -p zcash-glass-wasm --target wasm32-unknown-unknown
      - run: wasm-pack test --headless --chrome crates/zcash-glass-wasm
      - run: wasm-pack build crates/zcash-glass-wasm --target web --release
