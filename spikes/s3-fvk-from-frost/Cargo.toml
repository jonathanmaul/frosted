[package]
name = "s3-fvk-from-frost"
version = "0.0.0"
edition = "2024"
publish = false

# M0.3 spike (docs/SPIKES.md). Standalone crate, excluded from the Frosted workspace.
[workspace]

[dependencies]
anyhow = "1"
hex = "0.4"
orchard = "0.15"
pasta_curves = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
reddsa = { version = "0.5.2", features = ["frost"] }
serde_json = "1"
zcash_keys = { version = "0.16.1", features = ["orchard", "unstable-frost"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30.1"
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
