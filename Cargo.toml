[workspace]
resolver = "3"
members = ["crates/*"]
# Local tool sources and M0 spike crates are standalone, never part of the workspace.
exclude = [".tools", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonathanmaul/frosted"

[profile.release.package.zcash-glass-wasm]
opt-level = "z"
