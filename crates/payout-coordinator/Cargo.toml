[package]
name = "payout-coordinator"
description = "Private localhost coordinator for encrypted Glass Escrow markets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "=0.8.9"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
ed25519-dalek = "=2.2.0"
hex = "0.4.3"
frost-rerandomized = "=3.0.0"
glass-indexer = { path = "../glass-indexer" }
orchard = "0.16.0"
pasta_curves = "0.5.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reddsa = { version = "=0.5.2", features = ["frost"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "time", "signal", "net", "process", "io-util"] }
zcash-glass = { path = "../zcash-glass", features = ["payout-address"] }
zcash_keys = { version = "0.17.0-pre.2", features = ["orchard", "unstable-frost"] }
zcash_protocol = { version = "0.11.0-pre.1", features = ["local-consensus"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
