[package]
name = "frosted-api"
description = "Public REST + SSE API and signed ingest endpoint for the payout coordinator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "=0.8.9"
base64 = "0.22.1"
ed25519-dalek = "=2.2.0"
futures = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
frosted-verify = { path = "../frosted-verify" }
glass-indexer = { path = "../glass-indexer" }
zcash-glass = { path = "../zcash-glass" }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
orchard = "0.16.0"
zcash_keys = { version = "0.17.0-pre.2", features = ["orchard", "unstable-frost"] }
