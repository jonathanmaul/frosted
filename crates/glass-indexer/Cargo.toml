[package]
name = "glass-indexer"
description = "Public Glass Indexer: chain follower, UIVK scanner, bet validation, market lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
hex = "0.4.3"
# TLS (rustls) so a hosted https RPC endpoint works even when this crate is built on its own.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# sqlx 0.8: 0.9 pulls digest 0.11 (crypto-common 0.2), which conflicts with zcash_primitives 0.30.1.
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zcash-glass = { version = "0.1.0", path = "../zcash-glass", features = ["zcash"] }

[dev-dependencies]
orchard = "0.16.0"
zcash_keys = { version = "0.17.0-pre.2", features = ["orchard", "unstable-frost"] }
