[package]
name = "zcash-glass"
description = "Shared Frosted library: params, memo codec, Sealed Envelope, Thaw Tag, hashing, odds and payout math."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Functionality that needs Zcash libraries (scan in M2.7, UA parsing in M3.2). Off by default:
# the default build must not depend on orchard/zcash_*/zip321. Stable crate group (ADR-0015),
# proven in docs/SPIKES.md §M0.2.
payout-address = ["dep:zcash_address", "dep:zcash_protocol"]
zcash = ["payout-address", "dep:orchard", "dep:zcash_keys", "dep:zcash_note_encryption", "dep:zcash_primitives", "dep:zcash_protocol"]

[dependencies]
base64 = "0.23.1"
blake2b_simd = "1.0.5"
# RustCrypto generation on crypto-common 0.1: zcash_primitives 0.30.1 pins crypto-common
# =0.2.0-rc.1, which cannot coexist with the 0.2-stable generation (chacha20poly1305 0.11,
# hkdf 0.13, sha2 0.11). Algorithms are identical; see docs/SPIKES.md Appendix M4.
# No getrandom: randomness is supplied by the caller (SealRandomness), so the core builds for wasm32.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hex = "0.4"
hkdf = "0.12.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
orchard = { version = "0.15.5", optional = true }
zcash_keys = { version = "0.16.1", features = ["orchard"], optional = true }
zcash_note_encryption = { version = "0.4.2", optional = true }
zcash_primitives = { version = "0.30.1", optional = true }
zcash_protocol = { version = "0.10.6", features = ["local-consensus"], optional = true }

[dev-dependencies]
orchard = "0.15.5"
proptest = "1.12.0"

[dependencies.zcash_address]
version = "=0.13.0"
optional = true
